<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avianca | Portal Gestión Contratistas</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const { ResponsiveContainer, BarChart, Bar, LineChart, Line, XAxis, YAxis, Tooltip, Legend, LabelList, CartesianGrid } = window.Recharts;

    const firebaseConfig = {
      apiKey: "AIzaSyB0mSst2WJUYqfKUrwU1EDQUflAIxQzcKE",
      authDomain: "app-contratistas-59433.firebaseapp.com",
      projectId: "app-contratistas-59433",
      storageBucket: "app-contratistas-59433.firebasestorage.app",
      messagingSenderId: "383955501843",
      appId: "1:383955501843:web:7cd0ffd53eeb708e5110e6",
      measurementId: "G-FBGY01G5BF"
    };

    let db = null;
    if (typeof firebase !== 'undefined' && !firebase.apps.length) {
      try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
      } catch (e) {
        console.error("Firebase init error", e);
      }
    } else if (typeof firebase !== 'undefined' && firebase.apps.length) {
      db = firebase.firestore();
    }

    const AVIANCA_RED = '#E1251B';

    const ALL_COMPANIES = [
      ...["INGEMEEC", "SODEXO", "OSHO ING", "COLGRUAS", "AERORENTAL", "SPV", "GATEGOURMET", "TALMA", "SIATO", "DETECTA", "SECURITAS", "APARCAR", "ENERGIZAR", "UPSISTEMAS", "AUTOSNACK", "REG", "NEWREST", "EXTINTORES ANDINOS", "TERPEL", "MTI", "INVERSA", "ALL PLAST", "OAR INDUSTRIAS", "MITSUBISHI", "SODETRANS", "CABIFY", "LIDERTUR", "TRANS. 1A", "ARRIVESAFE", "RAMIREZ ARANA", "CHEVRON", "HELIOS", "JOHNSON CONTROLS", "Tu expreso Siglo XXI"].map((n, i) => ({ id: `p_${i}`, name: n, pin: (1001 + i).toString(), unidad: 'Pasajeros' })),
      ...["SPE", "Tri Fit", "Siato", "Cristian Cabrales", "Rafael Espinosa", "Ivan Gonzalez", "Monvi", "Securitas", "IM", "Deprisa", "Sodexo", "LG-COL", "Menzies COL", "Securitas COL", "Multitrans COL", "AGI US", "LG US", "Aerosan", "Talma"].map((n, i) => ({ id: `c_${i}`, name: n, pin: (2001 + i).toString(), unidad: 'Carga' }))
    ];

    const MESES = [
      {num:'01',nombre:'enero'},{num:'02',nombre:'febrero'},{num:'03',nombre:'marzo'},
      {num:'04',nombre:'abril'},{num:'05',nombre:'mayo'},{num:'06',nombre:'junio'},
      {num:'07',nombre:'julio'},{num:'08',nombre:'agosto'},{num:'09',nombre:'septiembre'},
      {num:'10',nombre:'octubre'},{num:'11',nombre:'noviembre'},{num:'12',nombre:'diciembre'}
    ];
    const ANIOS = ['2026', '2025', '2024'];

    const formatMesNombre = (mesStr) => { 
      if (!mesStr) return ''; 
      const parts = mesStr.split('-'); 
      if(parts.length < 2) return mesStr;
      const [m, a] = parts; 
      const obj = MESES.find(x => x.num === m); 
      return obj ? `${obj.nombre} ${a}` : mesStr; 
    };
    const safeNum = (val) => Number(val) || 0;
    
    // Fórmulas estándar OSH (Res 0312 de 2019)
    const calcFrecuencia = (at, trab) => safeNum(trab) > 0 ? ((safeNum(at) / safeNum(trab)) * 100).toFixed(2) : "0.00";
    const calcSeveridad = (diasInc, diasCargados, trab) => safeNum(trab) > 0 ? (((safeNum(diasInc) + safeNum(diasCargados)) / safeNum(trab)) * 100).toFixed(2) : "0.00";
    const calcTasaAccidentalidad = (at, trab) => safeNum(trab) > 0 ? ((safeNum(at) / safeNum(trab)) * 100).toFixed(2) : "0.00";
    const calcPropMortales = (atMort, at) => safeNum(at) > 0 ? ((safeNum(atMort) / safeNum(at)) * 100).toFixed(2) : "0.00";
    const calcAusentismo = (ausencia, programados) => safeNum(programados) > 0 ? ((safeNum(ausencia) / safeNum(programados)) * 100).toFixed(2) : "0.00";
    const calcIncidenciaEnf = (casosNuevos, trab) => safeNum(trab) > 0 ? ((safeNum(casosNuevos) / safeNum(trab)) * 100).toFixed(2) : "0.00";
    const calcPrevalenciaEnf = (casosNuevos, casosAntiguos, trab) => safeNum(trab) > 0 ? (((safeNum(casosNuevos) + safeNum(casosAntiguos)) / safeNum(trab)) * 100).toFixed(2) : "0.00";

    const Icons = {
      Building: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><path d="M9 22v-4h6v4"></path><path d="M8 6h.01"></path><path d="M16 6h.01"></path><path d="M12 6h.01"></path><path d="M12 10h.01"></path><path d="M12 14h.01"></path><path d="M16 10h.01"></path><path d="M16 14h.01"></path><path d="M8 10h.01"></path><path d="M8 14h.01"></path></svg>,
      Chart: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18"></path><path d="M18 17V9"></path><path d="M13 17V5"></path><path d="M8 17v-3"></path></svg>,
      ChevronRight: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"></path></svg>,
      ChevronLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"></path></svg>,
      LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>,
      FileText: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><line x1="10" y1="9" x2="8" y2="9"></line></svg>,
      Alert: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>,
      Heart: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path><path d="M12 5 9.04 7.96a2.17 2.17 0 0 0 0 3.08v0c.82.82 2.13.9 3.03.11l.24-.22"></path></svg>,
      Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
      Shield: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg>,
      Save: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>,
      Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2-2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
      Download: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
      X: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    };

    function App() {
      const [view, setView] = useState('home');
      const [currentUser, setCurrentUser] = useState(null);
      const [loginError, setLoginError] = useState('');
      
      // Login state
      const [loginTab, setLoginTab] = useState('Pasajeros');
      const [loginCompanyId, setLoginCompanyId] = useState('');
      const [loginPin, setLoginPin] = useState('');

      // Data state
      const [reports, setReports] = useState([]);
      const initialForm = { mesSeleccionado: '01', anioSeleccionado: '2026', trabajadores: '', diasProgramados: '', horasHombre: '', at: '', diasIncapacidad: '', diasCargados: '', atMortales: '', casosNuevos: '', casosAntiguos: '', diasAusencia: '' };
      const [formData, setFormData] = useState({...initialForm});
      const [showSuccessScreen, setShowSuccessScreen] = useState(false);

      // Admin Filters
      const [filterMonth, setFilterMonth] = useState('all');
      const [filterCompany, setFilterCompany] = useState('all');
      const [filterUnidad, setFilterUnidad] = useState('all');

      const handleDeleteReport = async (idToDelete) => {
         if (db) {
            try {
               await db.collection("reportes_hse").doc(idToDelete).delete();
            } catch (e) { console.error("Error al eliminar", e); }
         } else {
            const currentData = JSON.parse(localStorage.getItem('avianca_hse') || '[]');
            const newData = currentData.filter(r => r.id !== idToDelete);
            localStorage.setItem('avianca_hse', JSON.stringify(newData));
         }
         setReports(prev => prev.filter(r => r.id !== idToDelete));
      };

      useEffect(() => {
        if (db) {
          const unsubscribe = db.collection("reportes_hse").onSnapshot(
            (snapshot) => {
              const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setReports(data);
            },
            (err) => {
              console.error("Error cargando Firestore:", err);
            }
          );
          return () => unsubscribe();
        } else {
          setReports(JSON.parse(localStorage.getItem('avianca_hse') || '[]'));
        }
      }, [view]);

      // Export Excel
      const exportToExcel = (dataToExport) => {
        if (!window.XLSX) return;
        const formattedData = dataToExport.map(d => ({
          'Unidad de Negocio': d.unidad || 'Pasajeros',
          'Empresa Contratista': d.companyName,
          'Mes Reportado': formatMesNombre(d.mes),
          'N° Trabajadores': d.trabajadores,
          'Horas Hombre Trabajadas': d.horasHombre || 0,
          'Días Trabajo Programados': d.diasProgramados || 0,
          'Accidentes de Trabajo (AT)': d.at || 0,
          'Días Incapacidad AT': d.diasIncapacidad || 0,
          'AT Mortales': d.atMortales || 0,
          'Enfermedad L. Casos Nuevos': d.casosNuevos || 0,
          'Enfermedad L. Casos Antiguos': d.casosAntiguos || 0,
          'Días Ausencia Médica': d.diasAusencia || 0,
          'IF (Frecuencia AT)': Number(calcFrecuencia(d.at, d.trabajadores)),
          'IS (Severidad AT)': Number(calcSeveridad(d.diasIncapacidad, d.diasCargados, d.trabajadores)),
          'Tasa Accidentalidad': Number(calcTasaAccidentalidad(d.at, d.trabajadores))
        }));

        const worksheet = window.XLSX.utils.json_to_sheet(formattedData);
        const workbook = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(workbook, worksheet, "Indicadores_HSE");
        window.XLSX.writeFile(workbook, `Avianca_HSE_Res0312_${new Date().toISOString().split('T')[0]}.xlsx`);
      };

      // Filter Data for Admin
      const filteredReports = useMemo(() => reports.filter(r => (filterMonth === 'all' || r.mes === filterMonth) && (filterCompany === 'all' || r.companyId === filterCompany) && (filterUnidad === 'all' || r.unidad === filterUnidad)), [reports, filterMonth, filterCompany, filterUnidad]);
      
      // Chart & KPI Aggregation
      const { chartData, totals } = useMemo(() => {
         const grouped = {};
         let t = { trab:0, at:0, mort:0, hhl:0, aus:0, prog:0, inc:0, lab:0, enf:0 };

         filteredReports.forEach(r => {
             if(!grouped[r.mes]) grouped[r.mes] = { label: formatMesNombre(r.mes), at: 0, hhl: 0, if: 0, is: 0, tasa: 0, aus: 0, trab:0, inc:0, lab:0, prog:0, enf:0 };
             grouped[r.mes].at += safeNum(r.at);
             grouped[r.mes].hhl += safeNum(r.horasHombre);
             grouped[r.mes].trab += safeNum(r.trabajadores);
             grouped[r.mes].inc += safeNum(r.diasIncapacidad);
             grouped[r.mes].lab += safeNum(r.diasCargados);
             grouped[r.mes].prog += safeNum(r.diasProgramados);
             grouped[r.mes].aus += safeNum(r.diasAusencia);
             grouped[r.mes].enf += safeNum(r.casosNuevos);

             // Grand Totals
             t.trab += safeNum(r.trabajadores); t.at += safeNum(r.at); t.mort += safeNum(r.atMortales);
             t.hhl += safeNum(r.horasHombre); t.aus += safeNum(r.diasAusencia); t.prog += safeNum(r.diasProgramados);
             t.inc += safeNum(r.diasIncapacidad); t.lab += safeNum(r.diasCargados); t.enf += safeNum(r.casosNuevos) + safeNum(r.casosAntiguos);
         });

         const cData = Object.values(grouped).map(g => ({
             ...g,
             if: Number(calcFrecuencia(g.at, g.trab)),
             is: Number(calcSeveridad(g.inc, g.lab, g.trab)),
             tasa: Number(calcTasaAccidentalidad(g.at, g.trab)),
             aus: Number(calcAusentismo(g.aus, g.prog))
         })).sort((a,b) => a.label.localeCompare(b.label));

         return { chartData: cData, totals: t };
      }, [filteredReports]);

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoginError('');
        if (view === 'login-admin') {
          if (loginPin === '1234' || loginPin === 'avianca2026') { 
            setCurrentUser({ name: 'Administrador Avianca', role: 'admin' }); 
            setView('admin-dashboard'); 
          } else { 
            setLoginError('PIN de administrador incorrecto.'); 
          }
        } else {
          const comp = ALL_COMPANIES.find(c => c.id === loginCompanyId);
          if (!comp) { setLoginError('Seleccione una empresa.'); return; }
          if (comp.pin !== loginPin) { setLoginError('PIN de empresa incorrecto.'); return; }
          setCurrentUser({ ...comp, role: 'contractor' });
          setShowSuccessScreen(false);
          setFormData({...initialForm});
          setView('contractor-portal');
        }
      };

      const handleFormSubmit = async (e) => {
         e.preventDefault();
         const newR = { 
             ...formData, 
             companyId: currentUser.id, 
             companyName: currentUser.name, 
             unidad: currentUser.unidad,
             mes: `${formData.mesSeleccionado}-${formData.anioSeleccionado}`, 
             timestamp: Date.now()
         }; 
         try {
           if(db) {
             await db.collection("reportes_hse").add(newR); 
           } else {
             const l = JSON.parse(localStorage.getItem('avianca_hse') || '[]'); 
             l.push({ ...newR, id: Date.now().toString() }); 
             localStorage.setItem('avianca_hse', JSON.stringify(l));
           } 
           setShowSuccessScreen(true);
         } catch(err) {
           console.error("Error guardando reporte:", err);
           alert("Error guardando en la base de datos. Verifique su conexión o reglas de Firebase.");
         }
      };

      if (view === 'home') return (
        <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-6">
           <div className="text-center mb-14">
               <h1 className="text-5xl font-extrabold text-[#E1251B] tracking-tight mb-2">avianca</h1>
               <p className="text-slate-500 font-medium text-lg">Portal Gestión Contratistas</p>
           </div>
           <div className="grid md:grid-cols-2 gap-8 max-w-4xl w-full">
               <div onClick={() => { setView('login-contractor'); setLoginError(''); setLoginPin(''); setLoginCompanyId(''); }} className="bg-white rounded-2xl p-10 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-slate-100 cursor-pointer hover:shadow-lg transition-all text-center group flex flex-col items-center">
                   <div className="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mb-6 text-red-400 group-hover:scale-110 transition-transform"><Icons.Building/></div>
                   <h2 className="text-2xl font-bold text-slate-800 mb-3">Portal Contratistas</h2>
                   <p className="text-slate-500 text-sm mb-8 flex-grow leading-relaxed px-4">Registro mensual de accidentalidad, salud y ausentismo para Pasajeros y Carga.</p>
                   <span className="text-[#E1251B] font-semibold flex items-center gap-2 group-hover:translate-x-1 transition-transform">Ingresar <Icons.ChevronRight/></span>
               </div>
               <div onClick={() => { setView('login-admin'); setLoginError(''); setLoginPin(''); }} className="bg-white rounded-2xl p-10 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-slate-100 cursor-pointer hover:shadow-lg transition-all text-center group flex flex-col items-center">
                   <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-6 text-slate-600 group-hover:scale-110 transition-transform"><Icons.Chart/></div>
                   <h2 className="text-2xl font-bold text-slate-800 mb-3">Administración Avianca</h2>
                   <p className="text-slate-500 text-sm mb-8 flex-grow leading-relaxed px-4">Dashboard y exportación de indicadores Res 0312 de 2019.</p>
                   <span className="text-slate-800 font-semibold flex items-center gap-2 group-hover:translate-x-1 transition-transform">Acceder al Dashboard <Icons.ChevronRight/></span>
               </div>
           </div>
        </div>
      );
      
      if (view.includes('login')) return (
        <div className="min-h-screen flex items-center justify-center bg-slate-50 p-6 relative">
           <button onClick={() => setView('home')} className="absolute top-6 left-6 flex items-center gap-2 text-sm font-medium text-slate-600 bg-white px-4 py-2 rounded-lg shadow-sm border border-slate-200 hover:bg-slate-50 transition-colors"><Icons.ChevronLeft/> Volver al inicio</button>
           <div className="bg-white p-10 rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100 w-full max-w-md">
              <div className="text-center mb-8">
                 <h2 className="text-3xl font-extrabold text-[#E1251B] mb-2">avianca</h2>
                 <h3 className="font-semibold text-slate-800 text-lg">{view === 'login-admin' ? 'Acceso Administrador' : 'Acceso Contratistas'}</h3>
              </div>
              
              <form onSubmit={handleLoginSubmit} className="space-y-5">
                 {view === 'login-contractor' && (
                    <>
                      <div className="flex bg-slate-100 p-1 rounded-lg mb-6">
                         <button type="button" onClick={() => {setLoginTab('Pasajeros'); setLoginCompanyId('');}} className={`flex-1 py-2 text-sm font-semibold rounded-md transition-all ${loginTab === 'Pasajeros' ? 'bg-white shadow-sm text-[#E1251B]' : 'text-slate-500 hover:text-slate-700'}`}>Avianca Pasajeros</button>
                         <button type="button" onClick={() => {setLoginTab('Carga'); setLoginCompanyId('');}} className={`flex-1 py-2 text-sm font-semibold rounded-md transition-all ${loginTab === 'Carga' ? 'bg-white shadow-sm text-[#E1251B]' : 'text-slate-500 hover:text-slate-700'}`}>Avianca Carga</button>
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">Seleccione su Empresa ({loginTab})</label>

                            <XAxis dataKey="label" axisLine={{stroke: '#e2e8f0'}} tickLine={false} tick={{fill: '#64748b', fontSize: 11, angle: -45, textAnchor: 'end'}} dy={10} />
                            <Tooltip contentStyle={{borderRadius: '8px', border: '1px solid #e2e8f0', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)'}} />
                            <Line type="monotone" dataKey="if" stroke="#E1251B" strokeWidth={3} dot={{r: 6, fill: '#E1251B', strokeWidth: 2, stroke: '#fff'}} activeDot={{r: 8}}>
                              <LabelList dataKey="if" position="top" fill="#E1251B" fontSize={12} fontWeight={700} dy={-10} />
                            </Line>
                          </LineChart>
                        </ResponsiveContainer>
                      </div>
                  </div>
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                      <h3 className="text-lg font-bold text-[#E1251B] text-center mb-6">Índice de Severidad (IS)</h3>
                      <div className="h-72">
                        <ResponsiveContainer width="100%" height="100%">
                          <LineChart data={chartData} margin={{ top: 20, right: 20, left: 20, bottom: 60 }}>
                            <XAxis dataKey="label" axisLine={{stroke: '#e2e8f0'}} tickLine={false} tick={{fill: '#64748b', fontSize: 11, angle: -45, textAnchor: 'end'}} dy={10} />
                            <Tooltip contentStyle={{borderRadius: '8px', border: '1px solid #e2e8f0', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)'}} />
                            <Line type="monotone" dataKey="is" stroke="#E1251B" strokeWidth={3} dot={{r: 6, fill: '#E1251B', strokeWidth: 2, stroke: '#fff'}} activeDot={{r: 8}}>
                              <LabelList dataKey="is" position="top" fill="#E1251B" fontSize={12} fontWeight={700} dy={-10} />
                            </Line>
                          </LineChart>
                        </ResponsiveContainer>
                      </div>
                  </div>

                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                      <h3 className="text-lg font-bold text-[#E1251B] text-center mb-6">Tasa de Accidentalidad (%)</h3>
                      <div className="h-72">
                        <ResponsiveContainer width="100%" height="100%">
                          <LineChart data={chartData} margin={{ top: 20, right: 20, left: 20, bottom: 60 }}>
                            <XAxis dataKey="label" axisLine={{stroke: '#e2e8f0'}} tickLine={false} tick={{fill: '#64748b', fontSize: 11, angle: -45, textAnchor: 'end'}} dy={10} />
                            <Tooltip contentStyle={{borderRadius: '8px', border: '1px solid #e2e8f0', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)'}} />
                            <Line type="monotone" dataKey="tasa" stroke="#E1251B" strokeWidth={3} dot={{r: 6, fill: '#E1251B', strokeWidth: 2, stroke: '#fff'}} activeDot={{r: 8}}>
                              <LabelList dataKey="tasa" position="top" fill="#E1251B" fontSize={12} fontWeight={700} dy={-10} />
                            </Line>
                          </LineChart>
                        </ResponsiveContainer>
                      </div>
                  </div>
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                      <h3 className="text-lg font-bold text-[#E1251B] text-center mb-6">% de Ausentismo Médico</h3>
                      <div className="h-72">
                        <ResponsiveContainer width="100%" height="100%">
                          <BarChart data={chartData} margin={{ top: 20, right: 20, left: 20, bottom: 60 }}>
                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                            <XAxis dataKey="label" axisLine={false} tickLine={false} tick={{fill: '#64748b', fontSize: 11, angle: -45, textAnchor: 'end'}} dy={10} />
                            <Tooltip cursor={{fill: '#f8fafc'}} contentStyle={{borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)'}} />
                            <Bar dataKey="aus" fill="#94A3B8" radius={[4, 4, 0, 0]} barSize={50}>
                              <LabelList dataKey="aus" position="top" fill="#1e293b" fontSize={12} fontWeight={600} />
                            </Bar>
                          </BarChart>
                        </ResponsiveContainer>
                      </div>
                  </div>
              </div>

              {/* Table Data */}
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                  <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                      <div className="flex items-center gap-2"><Icons.FileText/><h3 className="text-lg font-bold text-slate-800">Detalle de Registros Reportados</h3></div>
                      <span className="text-xs font-semibold bg-slate-200 text-slate-600 px-3 py-1 rounded-full">{filteredReports.length} registros encontrados</span>
                  </div>
                  <div className="overflow-x-auto">
                      <table className="w-full text-sm text-right whitespace-nowrap">
                          <thead className="bg-slate-50 text-slate-500 font-bold text-xs uppercase border-b border-slate-200">
                              <tr>
                                  <th className="p-4 text-left">Unidad</th>
                                  <th className="p-4 text-left">Empresa Contratista</th>
                                  <th className="p-4 text-left">Mes</th>
                                  <th className="p-4">Trabajadores</th>
                                  <th className="p-4">H. Hombre</th>
                                  <th className="p-4">Acc. (AT)</th>
                                  <th className="p-4">Mortales</th>
                                  <th className="p-4 text-purple-600">Tasa Acc.</th>
                                  <th className="p-4">Frecuencia (IF)</th>
                                  <th className="p-4">Severidad (IS)</th>
                                  <th className="p-4">% Ausentismo</th>
                                  <th className="p-4 text-center">Acciones</th>
                              </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                              {filteredReports.map(r => (
                                  <tr key={r.id} className="hover:bg-slate-50 transition-colors">
                                      <td className="p-4 text-left"><span className={`px-2 py-1 rounded text-xs font-bold ${r.unidad === 'Carga' ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'}`}>{r.unidad}</span></td>
                                      <td className="p-4 text-left font-bold text-slate-800">{r.companyName}</td>
                                      <td className="p-4 text-left text-slate-600">{formatMesNombre(r.mes)}</td>
                                      <td className="p-4 font-medium text-slate-700">{r.trabajadores}</td>
                                      <td className="p-4 text-slate-600">{r.horasHombre}</td>
                                      <td className="p-4 font-bold text-[#E1251B]">{r.at}</td>
                                      <td className="p-4 font-bold text-slate-800">{r.atMortales}</td>
                                      <td className="p-4 font-bold text-purple-600">{calcTasaAccidentalidad(r.at, r.trabajadores)}%</td>
                                      <td className="p-4 text-slate-600">{calcFrecuencia(r.at, r.trabajadores)}</td>
                                      <td className="p-4 text-slate-600">{calcSeveridad(r.diasIncapacidad, r.diasCargados, r.trabajadores)}</td>
                                      <td className="p-4 text-slate-600">{calcAusentismo(r.diasAusencia, r.diasProgramados)}%</td>
                                      <td className="p-4 text-center">
                                          <button onClick={() => handleDeleteReport(r.id)} className="p-2 text-slate-400 hover:text-[#E1251B] hover:bg-red-50 rounded-lg transition-all" title="Eliminar reporte">
                                              <Icons.Trash/>
                                          </button>
                                      </td>
                                  </tr>
                              ))}
                          </tbody>
                          <tfoot className="bg-[#1E293B] text-white font-bold">
                              <tr>
                                  <td className="p-4 text-right" colSpan="3">TOTAL CONSOLIDADO:</td>
                                  <td className="p-4">{totals.trab}</td>
                                  <td className="p-4">{totals.hhl}</td>
                                  <td className="p-4 text-red-400">{totals.at}</td>
                                  <td className="p-4">{totals.mort}</td>
                                  <td className="p-4 text-purple-400">{calcTasaAccidentalidad(totals.at, totals.trab)}%</td>
                                  <td className="p-4">{calcFrecuencia(totals.at, totals.trab)}</td>
                                  <td className="p-4">{calcSeveridad(totals.inc, totals.lab, totals.trab)}</td>
                                  <td className="p-4">{calcAusentismo(totals.aus, totals.prog)}%</td>
                                  <td className="p-4"></td>
                              </tr>
                          </tfoot>
                      </table>
                  </div>
              </div>
           </main>
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
